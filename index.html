<style>
/* 인트로 = 제목 + 목차만(동하 10-01 「쓸데없는 내용 ㄴㄴ · 목차, 제목」) · 앱 디자인 언어(inset grouped · 큰 제목) · 색은 kit.css 토큰(기기 라이트/다크) */
body{margin:0;background:var(--bg);color:var(--label);}
.in{max-width:640px;margin:0 auto;padding:56px 20px 72px;font-size:17px;line-height:1.55;word-break:keep-all;}
.in h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.025em;margin:0 0 24px;}
.grp{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;}
.grp a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 16px 0 20px;color:var(--label);text-decoration:none;position:relative;}
.grp a+a::before{content:'';position:absolute;top:0;left:20px;right:0;height:.5px;background:var(--sep);}
.grp a:active{background:var(--fill);}
.in-foot{margin:16px 20px 0;font-size:13px;line-height:18px;color:var(--ter);}
.in-foot a{color:var(--acc);text-decoration:none;}
.grp a svg{width:8px;height:14px;color:var(--ter);flex:0 0 auto;}
@media (max-width:430px){ .in{padding:40px 16px 56px;} .in h1{font-size:28px;line-height:34px;} }
</style>
